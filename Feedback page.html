<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Author: Darius Fields -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #6fa3d9;
        }

        header {
            background-color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
        }

        nav a {
            text-decoration: none;
            color: black;
            margin-left: 15px;
        }

        .container {
            padding: 20px;
        }

        form {
            max-width: 500px;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: none;
        }

        button {
            background-color: black;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
        }

        .logo {
            width: 250px;
            display: block;
            margin-top: 20px;
        }

        footer {
            margin-top: 30px;
            background-color: #19325a;
            color: white;
            text-align: center;
            padding: 15px;
        }

        footer a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
        }

        .content{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:50px;
    margin-top:20px;
}

.form-section{
    width:55%;
}

.form-section h1{
    font-size:48px;
    margin-bottom:10px;
}

.form-section p{
    font-size:24px;
    margin-bottom:80px;
}

.name-row{
    display:flex;
    gap:15px;
    margin-bottom:15px;
}

.name-row div{
    flex:1;
}

label{
    display:block;
    margin-bottom:5px;
    font-size:12px;
    font-weight:bold;
}

.message-row{
    display:flex;
    gap:15px;
    align-items:flex-start;
}

textarea{
    resize:none;
    height:90px;
}

.message-row textarea{
    flex:1;
}

.message-row button{
    width:120px;
    height:45px;
    margin-top:0;
}

.image-section{
    width:40%;
}

.image-section img{
    width:100%;
    max-width:400px;
    background:white;
    padding:20px;
}
    </style>
</head>
<body>

<header>
    <h3>Cocky's Resource Guide</h3>

    <nav>
    <a href="index.html">Home</a>
    <a href="Food.html">Hungry?</a>
    <a href="Study.html">Studying?</a>
    <a href="Support.html">Need Help?</a>
    <a href="Feedback page.html">Feedback</a>
</nav>

</header>

    <div class="container">

    <div class="content">

        <div class="form-section">

            <h1>Got any Questions<br>or Feedback?</h1>

            <p>Submit your thoughts down below!</p>

            <form>

                <div class="name-row">
                    <div>
                        <label>First name</label>
                        <input type="text" placeholder="Jane">
                    </div>

                    <div>
                        <label>Last name</label>
                        <input type="text" placeholder="Smitherton">
                    </div>
                </div>

                <label>Email address</label>
                <input type="email" placeholder="email@example.com">

                <label>Your message</label>

                <div class="message-row">
                    <textarea rows="5"
                    placeholder="Enter your question or message"></textarea>

                    <button type="submit">Submit</button>
                </div>

            </form>

        </div>

        <div class="image-section">

                        <img src="https://i.pinimg.com/originals/d6/6b/82/d66b825a11e760fac62172b7cd271664.jpg" width="450" height="500">


        </div>

    </div>

</div>
